# Vi-like copy mode integrated with the Wayland clipboard.
set -g mouse on
set -g mode-keys vi
set -g status-keys vi
set -g history-limit 100000
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -s copy-command "wl-copy"
set -g set-clipboard on
set -g status off

set -g pane-border-style "fg=#4b5563"
set -g pane-active-border-style "fg=#79a7d8"

bind-key y copy-mode \; send-keys -X begin-selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
unbind-key -T copy-mode-vi MouseDragEnd1Pane
bind-key p run-shell "wl-paste --no-newline | tmux load-buffer -" \; paste-buffer

bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
