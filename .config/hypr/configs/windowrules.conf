# Window rules (Hyprland 0.56 rule syntax)
windowrule = match:tag multimedia_video, no_blur on, opacity 1.0
windowrule = match:tag settings, opacity 0.8, float on
windowrule = match:tag viewer, float on
windowrule = match:tag multimedia_video, float on, size 900 506

windowrule = match:class ^(org.gnome.Nautilus)$, opacity 0.8
windowrule = match:class ^(gedit|org.gnome.TextEditor|mousepad)$, opacity 0.9
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, opacity 0.9, float on, size 50% 60%
# Kitty handles its own slightly translucent background; do not compound it.
windowrule = match:class ^(kitty)$, opacity 1.0
windowrule = match:class ^(discord|vesktop|org.telegram.desktop)$, opacity 0.85 override 0.7 override 1 override
windowrule = match:class ^(Spotify)$, opacity 0.8 override 0.6 override 1 override
windowrule = match:class ^(zen)$, opacity 0.9 override 0.7 override 1 override

# Layer effects
layerrule = match:namespace waybar, blur on, ignore_alpha 0.5
layerrule = match:namespace logout_dialog, blur on
layerrule = match:namespace swaync-control-center, blur on, ignore_alpha 0.5, xray off
layerrule = match:namespace swaync-notification-window, blur on, ignore_alpha 0.5, xray off

# Ignore application maximize requests and tame transient dialogs.
windowrule = match:class .*, suppress_event maximize
windowrule = match:title ^(Save As|Save a File|Pick Files)$, float on, size 50% 60%, center on
windowrule = match:initial_title ^(Open Files)$, float on, size 70% 60%
