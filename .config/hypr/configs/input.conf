input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    accel_profile = adaptive

    touchpad {
        natural_scroll = true
    }
}

# Three-finger horizontal workspace swipe (Hyprland 0.50+ syntax).
gesture = 3, horizontal, workspace

# Add device-specific overrides locally only when a mouse needs them. Discover
# the device name with `hyprctl devices`; avoid committing hardware identifiers.
